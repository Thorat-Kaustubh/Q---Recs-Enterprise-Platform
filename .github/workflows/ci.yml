name: Quantium Q-RECS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Execute Pipeline Unit Tests
      run: |
        python -m unittest discover tests

    - name: Execute CLI End-to-End Pipeline Smoke Test
      run: |
        python main.py --pipeline all

    - name: Verify PDF Slide Deck Generation
      run: |
        test -f Quantium_Category_Review_Report.pdf
