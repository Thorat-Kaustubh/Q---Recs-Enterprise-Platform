[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantium-analytics"
version = "3.0.0"
description = "Quantium Enterprise Retail Experimentation & Customer Analytics Platform (Q-RECS)"
readme = "README.md"
authors = [
    { name = "Quantium Retail Data Science Team", email = "datascience@quantium.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "reportlab>=4.0.0",
    "streamlit>=1.28.0",
    "openpyxl>=3.1.0"
]

[project.scripts]
qrecs = "main:main"
